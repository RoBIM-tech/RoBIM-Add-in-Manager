name: Native-only no-SDK regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile production policy and verify pyRevit is disabled
        run: dotnet run -c Release --project tests/NativeOnlyPolicy/NativeOnlyPolicy.csproj
      - name: Check Windows builder PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('build-manager.ps1', 'scripts/Build-ManagerTestLocal.ps1', 'installer/Install.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$path parse error: $($errors | Out-String)" }
          }
